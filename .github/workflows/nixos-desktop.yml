name: NixOS desktop environment
on:
  push:
    branches: [main, codex/linux-musl-nixos]
  pull_request:
    paths: ['desktop/**', 'tools/**', '.github/workflows/nixos-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Publish
        run: |
          dotnet publish desktop/AgentControl/AgentControl.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o artifacts/app
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Run in Nix FHS
        run: nix-shell tools/nixos.nix --run 'bash tools/ci/nixos-smoke.sh'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nixos-environment
          path: |
            artifacts/*.log
            artifacts/result.json
            artifacts/screens/*.png
            artifacts/screens/erro.txt
          retention-days: 1
