name: NixOS desktop environment
on:
  push:
    branches: [main, codex/linux-musl-nixos]
  pull_request:
    paths: ['desktop/**', 'tools/**', '.github/workflows/nixos-desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with: {dotnet-version: '8.0.x'}
      - name: Publish
        run: |
          dotnet publish desktop/AgentControl/AgentControl.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o artifacts/app
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          nix_path: nixpkgs=channel:nixos-25.11
      - name: Run in Nix FHS
        run: |
          env_dir="$(nix-build tools/nixos.nix --no-out-link)"
          "$env_dir/bin/agent-control-env" -c 'bash tools/ci/nixos-smoke.sh'
          test -f artifacts/result.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: nixos-environment
          if-no-files-found: error
          path: |
            artifacts/*.log
            artifacts/result.json
            artifacts/screens/*.png
            artifacts/screens/erro.txt
          retention-days: 1
