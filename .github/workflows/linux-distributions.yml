name: Linux distributions
on:
  push:
    branches: [main, codex/native-platform-smoke, codex/linux-musl-nixos]
  pull_request:
    paths: ['desktop/**', 'android/app/src/main/res/drawable/**', 'src/**', 'test/**', 'tools/**', 'package*.json', 'jarvis.config.example.json', '.github/workflows/linux-distributions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.distro }} ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: alpine, image: 'alpine:3.23', rid: linux-musl-x64, runner: ubuntu-22.04}
          - {distro: arch, image: 'archlinux:base', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: ubuntu, image: 'ubuntu:22.04', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: debian, image: 'debian:12', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: fedora, image: 'fedora:latest', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: opensuse, image: 'opensuse/tumbleweed:latest', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: ubuntu-arm64, image: 'ubuntu:24.04', rid: linux-arm64, runner: ubuntu-24.04-arm}
          - {distro: debian-arm64, image: 'debian:12', rid: linux-arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: 24}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with: {dotnet-version: '8.0.x'}
      - name: Dependencies and native publish
        run: |
          npm ci
          dotnet publish desktop/AgentControl/AgentControl.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o artifacts/app
      - name: Run in the distribution
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm -v "$PWD:/workspace" -v "$node_root:/opt/node:ro" -w /workspace "$IMAGE" sh -c 'if command -v apk >/dev/null; then apk add --no-cache bash; fi; exec bash tools/ci/linux-distro-smoke.sh'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: linux-${{ matrix.distro }}
          path: |
            artifacts/*.log
            artifacts/result.json
            artifacts/screens/*.png
            artifacts/screens/erro.txt
          retention-days: 1
