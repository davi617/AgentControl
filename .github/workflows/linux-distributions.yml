name: Linux distributions
on:
  push:
    branches: [codex/native-platform-smoke]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.distro }} ${{ matrix.rid }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {distro: arch, image: 'archlinux:base', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: ubuntu, image: 'ubuntu:22.04', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: debian, image: 'debian:12', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: fedora, image: 'fedora:latest', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: opensuse, image: 'opensuse/tumbleweed:latest', rid: linux-x64, runner: ubuntu-22.04}
          - {distro: ubuntu-arm64, image: 'ubuntu:24.04', rid: linux-arm64, runner: ubuntu-24.04-arm}
          - {distro: debian-arm64, image: 'debian:12', rid: linux-arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Dependencies and native publish
        run: |
          npm ci
          dotnet publish desktop/AgentControl/AgentControl.csproj -c Release -r '${{ matrix.rid }}' --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o artifacts/app
      - name: Run in the distribution
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          node_root="$(dirname "$(dirname "$(command -v node)")")"
          docker run --rm -v "$PWD:/workspace" -v "$node_root:/opt/node:ro" -w /workspace "$IMAGE" bash tools/ci/linux-distro-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.distro }}
          path: |
            artifacts/*.log
            artifacts/result.json
            artifacts/screens/*.png
            artifacts/screens/erro.txt
          retention-days: 1
